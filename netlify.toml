[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Clean URLs without .html extensions
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/apropos"
  to = "/apropos.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/apps/vitae"
  to = "/apps/vitae.html"
  status = 200

[[redirects]]
  from = "/apps/vitae/privacy"
  to = "/apps/vitae-privacy.html"
  status = 200

[[redirects]]
  from = "/apps/travelbudget"
  to = "/apps/travelbudget.html"
  status = 200

[[redirects]]
  from = "/apps/forma"
  to = "/apps/forma.html"
  status = 200

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
