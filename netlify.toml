[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Domain redirects — must come before the clean-URL rules below so they win
# first (Netlify evaluates redirects top to bottom, first match applies).
[[redirects]]
  from = "https://www.weissgerber.dev/*"
  to = "https://weissgerber.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://weissgerber.netlify.app/*"
  to = "https://weissgerber.dev/:splat"
  status = 301
  force = true

# Legacy public URLs
[[redirects]]
  from = "/apropos"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/apps/vitae"
  to = "/products/vitae"
  status = 301
  force = true

[[redirects]]
  from = "/apps/vitae/privacy"
  to = "/products/vitae/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/apps/travelbudget"
  to = "/products/travelbudget"
  status = 301
  force = true

[[redirects]]
  from = "/apps/travelbudget/privacy"
  to = "/products/travelbudget/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/apps/forma"
  to = "/products/forma"
  status = 301
  force = true

[[redirects]]
  from = "/apps/forma/privacy"
  to = "/products/forma/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/best-study-apps"
  to = "/guides/study-planning/best-study-apps"
  status = 301
  force = true

[[redirects]]
  from = "/vitae-vs-brain-fm"
  to = "/guides/study-planning/vitae-vs-brain-fm"
  status = 301
  force = true

# Canonical clean URLs
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/products"
  to = "/products/index.html"
  status = 200

[[redirects]]
  from = "/products/vitae"
  to = "/products/vitae/index.html"
  status = 200

[[redirects]]
  from = "/products/vitae/privacy"
  to = "/products/vitae/privacy.html"
  status = 200

[[redirects]]
  from = "/products/travelbudget"
  to = "/products/travelbudget/index.html"
  status = 200

[[redirects]]
  from = "/products/travelbudget/privacy"
  to = "/products/travelbudget/privacy.html"
  status = 200

[[redirects]]
  from = "/products/forma"
  to = "/products/forma/index.html"
  status = 200

[[redirects]]
  from = "/products/forma/privacy"
  to = "/products/forma/privacy.html"
  status = 200

[[redirects]]
  from = "/products/moatcheck"
  to = "/products/moatcheck/index.html"
  status = 200

[[redirects]]
  from = "/products/moatcheck/methodology"
  to = "/products/moatcheck/methodology.html"
  status = 200

[[redirects]]
  from = "/guides/study-planning/best-study-apps"
  to = "/guides/study-planning/best-study-apps.html"
  status = 200

[[redirects]]
  from = "/guides/study-planning/vitae-vs-brain-fm"
  to = "/guides/study-planning/vitae-vs-brain-fm.html"
  status = 200

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
